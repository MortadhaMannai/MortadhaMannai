<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <!-- checkered flag pattern -->
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="6" height="6" fill="#f5f5f5"/>
      <rect x="6" width="6" height="6" fill="#111111"/>
      <rect y="6" width="6" height="6" fill="#111111"/>
      <rect x="6" y="6" width="6" height="6" fill="#f5f5f5"/>
    </pattern>

    <!-- card background gradient (dark, GitHub-dark friendly) -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#01040a"/>
    </linearGradient>

    <!-- grass gradient -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a24"/>
      <stop offset="100%" stop-color="#0b2417"/>
    </linearGradient>

    <!-- the racing line the car follows (invisible, matches the drawn track's centerline) -->
    <path id="trackpath"
      d="M 170,60
         L 640,60
         Q 730,60 730,140
         Q 730,220 640,220
         L 170,220
         Q 80,220 80,140
         Q 80,60 170,60 Z"
      fill="none" />
  </defs>

  <!-- outer card -->
  <rect x="1" y="1" width="898" height="278" rx="14" fill="url(#bg)" stroke="#e10600" stroke-width="1.5"/>

  <!-- title -->
  <text x="450" y="30" text-anchor="middle" fill="#e10600" font-size="16" font-weight="bold" letter-spacing="2">
    🏁 EXPLAINABLE AI GRAND PRIX — LIVE TELEMETRY 🏁
  </text>

  <!-- grass field behind the track -->
  <rect x="40" y="45" width="730" height="190" rx="95" fill="url(#grass)"/>

  <!-- track asphalt -->
  <path d="M 170,60 L 640,60 Q 730,60 730,140 Q 730,220 640,220 L 170,220 Q 80,220 80,140 Q 80,60 170,60 Z"
        fill="none" stroke="#2b2f36" stroke-width="34" stroke-linejoin="round"/>

  <!-- red/white curbs -->
  <path d="M 170,60 L 640,60 Q 730,60 730,140 Q 730,220 640,220 L 170,220 Q 80,220 80,140 Q 80,60 170,60 Z"
        fill="none" stroke="#ffffff" stroke-width="38" stroke-dasharray="14 14" opacity="0.15"/>

  <!-- dashed centerline -->
  <path d="M 170,60 L 640,60 Q 730,60 730,140 Q 730,220 640,220 L 170,220 Q 80,220 80,140 Q 80,60 170,60 Z"
        fill="none" stroke="#f5f5f5" stroke-width="1.5" stroke-dasharray="8 10" opacity="0.6"/>

  <!-- start/finish checkered strip -->
  <rect x="163" y="44" width="14" height="32" fill="url(#checker)"/>

  <!-- pit-wall labels around the track -->
  <text x="450" y="52" text-anchor="middle" fill="#8b949e" font-size="10" letter-spacing="1">PYTHON · PYTORCH · TENSORFLOW · GCP · DOCKER</text>
  <text x="450" y="235" text-anchor="middle" fill="#8b949e" font-size="10" letter-spacing="1">XAI RESEARCH SECTOR — FINANCE &amp; ACCOUNTING CHICANE</text>

  <!-- driver card -->
  <text x="450" y="140" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">MOHAMED MORTADHA MANAI</text>
  <text x="450" y="158" text-anchor="middle" fill="#6e7681" font-size="10">Car #01 · AI Engineer @ SFEIR Paris · GDE Cloud AI</text>

  <!-- the car, riding the trackpath -->
  <g font-size="26">
    <text text-anchor="middle" dy="8">🏎️</text>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#trackpath"/>
    </animateMotion>
  </g>

  <!-- faint speed-trail dots, following the same path with a phase delay -->
  <g opacity="0.5" font-size="10" fill="#e10600">
    <circle r="2.4">
      <animateMotion dur="7s" repeatCount="indefinite" begin="-0.15s">
        <mpath href="#trackpath"/>
      </animateMotion>
    </circle>
    <circle r="2" opacity="0.6">
      <animateMotion dur="7s" repeatCount="indefinite" begin="-0.3s">
        <mpath href="#trackpath"/>
      </animateMotion>
    </circle>
  </g>

  <text x="450" y="266" text-anchor="middle" fill="#484f58" font-size="10" font-style="italic">
    Fueled by curiosity. Powered by XAI. Redlined on caffeine.
  </text>
</svg>
